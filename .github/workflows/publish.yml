# Secure PyPI Trusted Publishing with exact artifact reuse (#56).
#
# Contract enforced here:
#   * `provenance` — ONE intentional trigger (a published GitHub Release). Before
#                    anything is built or published, assert that the release tag,
#                    the authoritative `crewd.__version__`, and the commit the tag
#                    points at are mutually consistent (tag `vX.Y.Z` <-> version
#                    `X.Y.Z` <-> `github.sha`). A mismatch fails the run early.
#   * `build`      — build the wheel + sdist EXACTLY ONCE from the tagged commit,
#                    record SHA-256 checksums + content manifests, and upload the
#                    immutable artifacts for the downstream jobs.
#   * `acceptance` — on every supported Python minor, DOWNLOAD (never rebuild)
#                    those exact artifacts, re-verify their checksums, and run the
#                    merged #52 clean-install/offline-CLI smoke against them.
#   * `publish`    — ONLY after acceptance is green, download the SAME artifacts
#                    (no rebuild) and publish them to PyPI via Trusted Publishing
#                    (OIDC) using the protected `pypi` environment.
#
# Security posture (least privilege):
#   * Default `permissions: contents: read`; `id-token: write` is granted ONLY on
#     the `publish` job — no pull-request/OIDC path, no long-lived API token, no
#     secret echo, no broad repository write, and no manual `twine upload`.
#   * Every third-party action is pinned to a reviewed immutable 40-hex commit SHA.
#   * `concurrency` serialises per-tag and never cancels an in-flight publish.
#   * Retry is safe/idempotent: acceptance is deterministic, and the publish step
#     uses `skip-existing: true` so re-running a partially-published release does
#     not error on files PyPI already has.
#
# How to release (documented event + retry):
#   1. Bump `__version__` in `src/crewd/__init__.py`, land it on `main`.
#   2. Tag the release commit `vX.Y.Z` (matching that version) and create a
#      GitHub Release from that tag:
#        git tag -a vX.Y.Z -m "crewd X.Y.Z" && git push origin vX.Y.Z
#        gh release create vX.Y.Z --title "crewd X.Y.Z" --notes-file CHANGELOG.md
#      Publishing to `release: published` starts THIS workflow.
#   3. A protected-environment reviewer approves the `pypi` deployment; only then
#      does the publish job run against the already-accepted artifacts.
#   4. Retry: re-run the failed run (or re-publish the same Release). Because the
#      artifacts are rebuilt identically from the immutable tag and the publish
#      step skips files already on PyPI, retries are safe and non-duplicating.
#
# This workflow never runs on pull requests and cannot publish from a fork.
name: Publish

on:
  release:
    types: [published]

# Least privilege: the workflow as a whole only reads the repository. Only the
# `publish` job below escalates, and only to the `id-token: write` needed for
# OIDC Trusted Publishing. There is no `contents: write`/`packages` anywhere.
permissions:
  contents: read

# Serialise releases of the same tag and NEVER cancel an in-flight publish (a
# cancelled publish could leave a release half-uploaded). Distinct tags run
# independently.
concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  # Deterministic, offline-by-default execution for the build/accept jobs.
  CREWD_DISABLE_PUBLIC_BUS: "1"

jobs:
  provenance:
    name: provenance (tag/version/commit)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout the tagged commit (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Assert tag <-> version <-> commit consistency
        id: check
        env:
          # The tag the Release was published from, passed via env (never
          # interpolated into the shell) to avoid script injection.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ github.event.release.target_commitish }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Authoritative version is the single source in src/crewd/__init__.py.
          version="$(python -c 'import re,pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("src/crewd/__init__.py").read_text()).group(1))')"
          echo "authoritative version: ${version}"
          echo "release tag:           ${RELEASE_TAG}"
          echo "release target:        ${RELEASE_SHA}"
          echo "checkout sha:          ${CHECKOUT_SHA}"
          # Tag must be exactly v<version> (commit provenance: the workflow runs
          # against github.sha, which for a release event is the tagged commit).
          if [ "${RELEASE_TAG}" != "v${version}" ]; then
            echo "::error::release tag '${RELEASE_TAG}' does not match authoritative version 'v${version}'"
            exit 1
          fi
          # Confirm the checked-out commit is the one the tag resolves to.
          tag_sha="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          if [ "${tag_sha}" != "${CHECKOUT_SHA}" ]; then
            echo "::error::tag '${RELEASE_TAG}' -> ${tag_sha} but building ${CHECKOUT_SHA}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: build-once
    runs-on: ubuntu-latest
    needs: provenance
    outputs:
      wheel-sha256: ${{ steps.hashes.outputs.wheel }}
      sdist-sha256: ${{ steps.hashes.outputs.sdist }}
    steps:
      - name: Checkout the tagged commit (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          # Download cache only; it can never alter release contents.
          enable-cache: true
      - name: Build wheel + sdist once (standards build)
        run: uv build --no-sources --out-dir dist
      - name: Record SHA-256 checksums and content manifests
        id: hashes
        run: |
          set -euo pipefail
          cd dist
          sha256sum crewd-*.whl crewd-*.tar.gz | tee SHA256SUMS
          # Human-/machine-readable content manifests (evidence, not inputs).
          python - <<'PY' | tee MANIFEST.txt
          import glob, tarfile, zipfile
          whl = glob.glob("crewd-*.whl")[0]
          sdist = glob.glob("crewd-*.tar.gz")[0]
          print(f"# wheel: {whl}")
          for n in sorted(zipfile.ZipFile(whl).namelist()):
              print(n)
          print(f"# sdist: {sdist}")
          with tarfile.open(sdist, "r:gz") as tf:
              for m in sorted(m.name for m in tf.getmembers() if m.isfile()):
                  print(m)
          PY
          {
            echo "wheel=$(sha256sum crewd-*.whl | cut -d' ' -f1)"
            echo "sdist=$(sha256sum crewd-*.tar.gz | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - name: Upload immutable artifacts (+ evidence)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crewd-dist
          path: |
            dist/crewd-*.whl
            dist/crewd-*.tar.gz
            dist/SHA256SUMS
            dist/MANIFEST.txt
          if-no-files-found: error
          retention-days: 14

  acceptance:
    name: accept (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Bounded by `Requires-Python >=3.11`; kept in lockstep with ci.yml and
        # the declared Trove classifiers (see tests/test_publish_workflow.py).
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout (pinned)  # provides the #52 harness only; not installed
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          enable-cache: true
      - name: Set up Python (pinned)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download the single build's artifacts (no rebuild)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: crewd-dist
          path: dist
      - name: Re-verify downloaded artifact checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
      - name: Metadata + content contract on downloaded artifacts
        run: uv run --python ${{ matrix.python-version }} --with twine python -m twine check dist/crewd-*.whl dist/crewd-*.tar.gz
      - name: Clean-install + offline CLI smoke on downloaded artifacts
        # Reuses the merged #52 harness with --dist so it installs the DOWNLOADED
        # wheel/sdist in fresh venvs outside the checkout and never rebuilds.
        run: uv run --python ${{ matrix.python-version }} python scripts/clean_install_smoke.py --dist dist --json smoke-${{ matrix.python-version }}.json
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-${{ matrix.python-version }}
          path: smoke-${{ matrix.python-version }}.json
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: publish (pypi / trusted publishing)
    runs-on: ubuntu-latest
    # Publish ONLY after provenance + every acceptance job has passed. No rebuild.
    needs: [provenance, acceptance]
    # Protected environment: a human/branch rule gates the deployment, and the
    # PyPI Trusted Publisher is bound to this exact environment name.
    environment:
      name: pypi
      url: https://pypi.org/project/crewd/${{ needs.provenance.outputs.version }}/
    # Least privilege: OIDC token to authenticate to PyPI, nothing more. This is
    # the ONLY job that escalates beyond the read-only default.
    permissions:
      id-token: write
    steps:
      - name: Download the accepted artifacts (no rebuild)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: crewd-dist
          path: dist
      - name: Drop evidence files (publish only the distributions)
        run: |
          set -euo pipefail
          rm -f dist/SHA256SUMS dist/MANIFEST.txt
          ls -1 dist
      - name: Publish to PyPI via Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Idempotent retries: never fail if PyPI already has a file from a
          # previous partial run of the same release.
          skip-existing: true
          # Publish exactly the reviewed distributions; no source rebuild.
          packages-dir: dist
