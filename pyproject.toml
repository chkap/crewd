[project]
name = "crewd"
dynamic = ["version"]
description = "Multi-agent coding crew CLI — workspace-based, GitHub Issues as bus"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BigKai" }]
maintainers = [{ name = "BigKai" }]
keywords = [
    "cli",
    "agents",
    "multi-agent",
    "copilot",
    "coding-agent",
    "orchestration",
    "github",
]
# Only claims backed by tests/runtime in this repo are made here. Additional
# Python minors are added to the classifier list once the CI matrix proves them
# green (see #43). No maturity, security, or OS-specific guarantee is asserted.
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.24",
    "rich>=15",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "jinja2>=3.1",
    # Official Copilot SDK backend (import `copilot`). `backend: copilot-sdk` is
    # the default and only production backend (the legacy `copilot -p` CLI
    # backend is retired), so the SDK is a required runtime dependency — a plain
    # `uv sync` / `pip install crewd` must yield a runnable install. See
    # docs/sdk-backend.md.
    "github-copilot-sdk>=1.0.8",
]

[project.scripts]
crewd = "crewd.cli:app"

[project.urls]
Repository = "https://github.com/chkap/crewd"
Issues = "https://github.com/chkap/crewd/issues"
Documentation = "https://github.com/chkap/crewd#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/crewd/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/crewd"]
# The installed wheel ships only the importable package: Python modules plus the
# runtime Jinja templates that live under `src/crewd/templates`. LICENSE is
# bundled automatically via `license-files`. Tests, docs, developer scripts, and
# bytecode caches are never part of the wheel (see tests/test_release_artifacts.py).
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
]

[tool.hatch.build.targets.sdist]
# Reproducible, lean source distribution (#52): everything required to rebuild
# the wheel plus the packaging-facing docs, and nothing else. Tests, developer/
# live-only scripts, retrospective material, design docs, lockfiles, caches, and
# local crew/workspace state are intentionally excluded. The exact contract is
# enforced by tests/test_release_artifacts.py so it cannot silently regress.
include = [
    "/src/crewd",
    "/pyproject.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/SKILL.md",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
