[project]
name = "crewd"
version = "0.1.0"
description = "Multi-agent coding crew CLI — workspace-based, GitHub Issues as bus"
readme = "README.md"
authors = [{ name = "BigKai" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.24",
    "rich>=15",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "jinja2>=3.1",
]

[project.scripts]
crewd = "crewd.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewd"]

[tool.hatch.build.targets.wheel.force-include]
"src/crewd/templates" = "crewd/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
