[project]
name = "crewd"
version = "0.1.0"
description = "Multi-agent coding crew CLI — workspace-based, GitHub Issues as bus"
readme = "README.md"
authors = [{ name = "BigKai" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.24",
    "rich>=15",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "jinja2>=3.1",
    # Official Copilot SDK backend (import `copilot`). `backend: copilot-sdk` is
    # the default and only production backend (the legacy `copilot -p` CLI
    # backend is retired), so the SDK is a required runtime dependency — a plain
    # `uv sync` / `pip install crewd` must yield a runnable install. See
    # docs/sdk-backend.md.
    "github-copilot-sdk>=1.0.8",
]

[project.scripts]
crewd = "crewd.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
